name: Clario feature smoke tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/full-platform-recovery]

jobs:
  frontend-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check public/deep-think.js
          node --check public/profile-studio.js
      - name: Verify Deep Think is wired into the app
        run: |
          grep -q 'id="deep-think-start"' public/index.html
          grep -q '<script src="deep-think.js"></script>' public/index.html
          grep -q '<script src="profile-studio.js"></script>' public/index.html
          grep -q 'Edit social profile' public/profile-studio.js
          grep -q 'profile_visibility' public/profile-studio.js
          grep -q 'submit_deep_think_case' public/deep-think.js
          grep -q 'review_deep_think_case' public/deep-think.js
      - name: Verify Deep Think does not explicitly call AI services
        run: |
          ! grep -Eiq 'openai|anthropic|gemini|fetch\(|embeddings|createChatCompletion' public/deep-think.js
      - name: Verify database authorization safeguards
        run: |
          grep -q 'enable row level security' supabase/migrations/202610240001_deep_think.sql
          grep -q "p.role = 'owner'" supabase/migrations/202610240001_deep_think.sql
          ! grep -q "p.role in ('admin','owner')" supabase/migrations/202610240001_deep_think.sql
          grep -q 'Owner access required' supabase/migrations/202610240001_deep_think.sql
          grep -q 'deep_think_case_events' supabase/migrations/202610240001_deep_think.sql
          ! grep -E 'grant select .*internal_note' supabase/migrations/202610240001_deep_think.sql
          test "$(grep -Fc 'end $$;' supabase/migrations/202610240001_deep_think.sql)" -eq 2
      - name: Verify profile privilege protection migration
        run: |
          grep -q "create trigger clario_guard_profile_privileges" supabase/migrations/202610240002_social_profile_foundation.sql
          grep -q "new.role is distinct from old.role" supabase/migrations/202610240002_social_profile_foundation.sql
          grep -q "new.plan is distinct from old.plan" supabase/migrations/202610240002_social_profile_foundation.sql
          grep -q "profile_visibility" supabase/migrations/202610240002_social_profile_foundation.sql
          grep -q "Self-promotion to owner unexpectedly succeeded" .github/scripts/test-social-profile-migration.sql
          grep -q "Self-upgrade to paid plan unexpectedly succeeded" .github/scripts/test-social-profile-migration.sql
      - name: Verify screen tracker preserves all designs
        run: test "$(grep -Ec '^\| [0-9]+ \|' docs/SCREEN_IMPLEMENTATION_TRACKER.md)" -eq 135

  migration-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clario_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clario_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clario_test
      TEST_USER: 10000000-0000-4000-8000-000000000001
      TEST_OWNER: 10000000-0000-4000-8000-000000000002
      TEST_OTHER: 10000000-0000-4000-8000-000000000003
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare isolated Supabase-compatible auth fixture
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f .github/scripts/deep-think-ci-fixture.sql
      - name: Apply migration to disposable PostgreSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202610240001_deep_think.sql
      - name: Test submission, row-level isolation, and owner-only review
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select set_config('request.jwt.claim.sub', '$TEST_USER', false); select public.submit_deep_think_case('CI test decision', 'test background', 'test goals', 'option A; option B', 'test constraints', 'test risks', 'CI only');"
          own_count="$(psql "$DATABASE_URL" -Atq -c "SET ROLE authenticated; SELECT set_config('request.jwt.claim.sub', '$TEST_USER', false); SELECT count(*) FROM public.deep_think_cases;" | tail -n1)"
          other_count="$(psql "$DATABASE_URL" -Atq -c "SET ROLE authenticated; SELECT set_config('request.jwt.claim.sub', '$TEST_OTHER', false); SELECT count(*) FROM public.deep_think_cases;" | tail -n1)"
          owner_count="$(psql "$DATABASE_URL" -Atq -c "SET ROLE authenticated; SELECT set_config('request.jwt.claim.sub', '$TEST_OWNER', false); SELECT count(*) FROM public.deep_think_cases;" | tail -n1)"
          test "$own_count" = "1"
          test "$other_count" = "0"
          test "$owner_count" = "1"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select set_config('request.jwt.claim.sub', '$TEST_OWNER', false); select public.review_deep_think_case((select id from public.deep_think_cases limit 1), 'delivered', 'CI human decision', 'CI private note');"
          delivered="$(psql "$DATABASE_URL" -Atq -c "select count(*) from public.deep_think_cases where status='delivered' and final_decision='CI human decision';")"
          test "$delivered" = "1"
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select set_config('request.jwt.claim.sub', '$TEST_USER', false); select public.review_deep_think_case((select id from public.deep_think_cases limit 1), 'in_review', null, 'unauthorized');" >/tmp/unauthorized-review.log 2>&1; then
            echo "A normal user unexpectedly reviewed a Deep Think case."
            exit 1
          fi
